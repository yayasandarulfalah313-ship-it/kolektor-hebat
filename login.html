<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolektor Hebat - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <span class="emblem"></span>
            <h1>KOLEKTOR HEBAT</h1>
            <p>YAYASAN DARUL FALAH</p>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="loginRole"> Pilih Peran</label>
                <select id="loginRole" required>
                    <option value="">-- Pilih Peran --</option>
                    <option value="admin">🔑 Administrator</option>
                    <option value="user"> Kolektor / User</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">🔒 Password</label>
                <input type="password" id="loginPassword" placeholder="Masukkan password..." required>
            </div>
            
            <button type="submit" class="login-btn">🚀 MASUK</button>
        </form>
        
        <div class="login-footer">
            <p> Password Default:</p>
            <p style="margin-top: 5px; font-size: 0.8rem;">
                Admin: <strong style="color: var(--merah);">admin2026</strong> | 
                User: <strong style="color: var(--merah);">user2026</strong>
            </p>
            <p style="margin-top: 10px; font-size: 0.75rem; color: #6B7280;">
                © 2026 Yayasan Darul Falah - Bantaeng
            </p>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
